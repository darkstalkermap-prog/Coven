name: Deploy Coven to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'Scripts/*_smoke.mjs'
      - 'Scripts/ui_check.mjs'
      - 'Scripts/music_check.mjs'
      - 'Scripts/live_check.mjs'
      - 'Scripts/browsers.mjs'
      - 'Scripts/build_browser.mjs'
      - 'server/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build standalone site
        run: npm run build
        env:
          # Set the repository variable COVEN_SERVER to your multiplayer server's address.
          COVEN_SERVER: ${{ vars.COVEN_SERVER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # The whole browser suite (solo, two players on the server, a player-hosted game, everything a player touches,
  # the music) in each browser: Chromium, Google Chrome, Firefox and WebKit (the engine of Safari).
  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Build standalone site
        run: npm run build
        env:
          COVEN_SERVER: ${{ vars.COVEN_SERVER }}
      - name: Install ${{ matrix.browser }}
        shell: bash
        run: |
          # GitHub's Ubuntu machines come with Google Chrome; the others are Playwright's builds.
          if [ "${{ matrix.browser }}" = chrome ]; then google-chrome --version || npx playwright install --with-deps chrome
          else npx playwright install --with-deps ${{ matrix.browser }}; fi
      - name: Browser tests in ${{ matrix.browser }}
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -o pipefail
          # Firefox needs a window (on a virtual display) to get WebGL without a graphics card.
          RUN=; if [ "$BROWSER" = firefox ]; then export HEADED=1; RUN="xvfb-run -a"; fi
          # On failure, surface the test's error lines as annotations so they show in the run summary.
          $RUN npm run test:browser 2>&1 | tee browser.log || { grep -E "Error|assert|expected|actual|Timeout|  at |PASS|✗|FAILED|checks passed|events:" browser.log | head -40 | sed "s/^/::error::${{ matrix.browser }}: /"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: matrix.browser == 'chromium'
        with:
          name: music-recordings
          path: test-results/music-*.wav

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, browser-tests]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4

  # Once published, the live site is opened in each browser and the game started there.
  live-check:
    name: Live site (${{ matrix.browser }})
    needs: deploy
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Install ${{ matrix.browser }}
        shell: bash
        run: |
          if [ "${{ matrix.browser }}" = chrome ]; then google-chrome --version || npx playwright install --with-deps chrome
          else npx playwright install --with-deps ${{ matrix.browser }}; fi
      - name: Check the live game in ${{ matrix.browser }}
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -o pipefail
          RUN=; if [ "$BROWSER" = firefox ]; then export HEADED=1; RUN="xvfb-run -a"; fi
          $RUN node Scripts/live_check.mjs "${{ needs.deploy.outputs.page_url }}" 2>&1 | tee live.log || { grep -E "try|✗|FAILED" live.log | sed "s/^/::error::${{ matrix.browser }}: /"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.browser }}
          path: test-results/live-*.png
